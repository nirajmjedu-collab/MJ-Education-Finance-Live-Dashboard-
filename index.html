<style>
:root{
  --bg:#eef2f7; --panel:#ffffff; --ink:#0f2238; --muted:#5b6b7e; --line:#d8e0ea;
  --brand:#013f70; --on-brand:#ffffff; --accent:#da251c; --on-accent:#ffffff;
  --side:#013f70; --side-ink:#c3d5e8;
  --gold:#e0a526; --ok:#1f7a4d; --warn:#b26a00; --bad:#c0261c; --info:#2a6db0;
  --hover:#f3f6fa; --head:#f4f7fb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#08121f; --panel:#0f2036; --ink:#e7eef7; --muted:#8fa3bb; --line:#1d3350;
    --brand:#6aaae6; --on-brand:#06121f; --accent:#e63a2f; --on-accent:#ffffff;
    --side:#061425; --side-ink:#9db4cf;
    --gold:#e8b93f; --ok:#4cc38a; --warn:#e3a84d; --bad:#ff7a6e; --info:#7fb4e8;
    --hover:#14294a; --head:#13263f;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-feature-settings:'tnum' 1}
h1,h2,h3{font-family:'Outfit','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brandbox{background:#fff;border-radius:12px;padding:10px 12px}
.brandbox img{display:block;width:100%;height:auto}
.brandsub{font:600 11.5px 'DM Sans',sans-serif;color:var(--side-ink);padding:10px 4px 16px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:9px 12px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.side .who{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.side .who b{display:block;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .who button{margin-top:6px;background:none;border:0;padding:0;color:var(--side-ink);text-decoration:underline;cursor:pointer}

.main{padding:26px clamp(16px,3vw,40px) 64px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:30px;line-height:1.1;color:var(--brand)}
.top p{margin:4px 0 0;color:var(--muted)}
.live{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok)} .pill.err .dot{background:var(--bad)}
.pill.busy .dot{background:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pill.busy .dot{animation:none}}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}

.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:130px}
.f.grow{flex:1 1 220px}
.f select,.f input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:14px;width:100%}

/* ledger strip: the one memorable element */
.ledger{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(4,minmax(130px,1fr));background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;margin-bottom:16px}
.ledger>div{padding:16px 20px;border-left:1px solid var(--line)}
.ledger>div:first-child{border-left:0}
.ledger .lbl{color:var(--muted);font-size:13px}
.ledger .val{font:700 26px/1.15 'Outfit',sans-serif;margin-top:4px;overflow-wrap:anywhere}
.ledger .big .val{font-size:40px;color:var(--brand)}
.ledger .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
@media (max-width:1100px){.ledger{grid-template-columns:1fr 1fr}.ledger>div{border-left:0;border-top:1px solid var(--line)}.ledger>div:first-child{grid-column:1/-1;border-top:0}}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h3{font-size:16px;margin-bottom:10px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media (max-width:1000px){.s8,.s7,.s5,.s4,.s6{grid-column:span 12}}
.chart{position:relative;height:280px}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--head);font-weight:600;cursor:pointer;user-select:none;z-index:1}
th.num,td.num{text-align:right}
th .arr{color:var(--brand);margin-left:4px}
tbody tr:hover{background:var(--hover)}
tr[data-row]{cursor:pointer}
td.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis}
tfoot td{font-weight:600;background:var(--head);position:sticky;bottom:0}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid currentColor}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.info{color:var(--info)}.chip.mute{color:var(--muted)}
.bar{display:block;height:6px;border-radius:3px;background:var(--brand);min-width:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 10px;color:var(--muted)}
.tools .grp{display:flex;gap:8px;align-items:center}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 16px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.hint{margin:0 0 12px;color:var(--muted);font-size:13.5px}
tr[data-invrow]{cursor:pointer}
.drawer.wide{width:min(780px,100%)}
.drawer h3{font-size:16px}

.notice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:18px 20px;max-width:760px}
.notice h2{font-size:20px;margin-bottom:6px}
.notice p{margin:6px 0;color:var(--muted)}
.notice code,.kv code{background:var(--head);padding:1px 6px;border-radius:4px;font-size:13px;overflow-wrap:anywhere}
.notice .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.skel{height:84px;border-radius:12px;background:linear-gradient(90deg,var(--panel),var(--hover),var(--panel));background-size:200% 100%;animation:sh 1.4s linear infinite;border:1px solid var(--line);margin-bottom:16px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

.settings{display:grid;gap:16px;max-width:820px}
.settings label{display:flex;flex-direction:column;gap:4px;font-weight:500}
.settings textarea,.settings select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.settings textarea{min-height:92px;resize:vertical;font-size:13px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;font-size:14px}
.kv .miss{color:var(--bad)}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:30px;max-width:460px;width:100%}
.login h1{font-size:28px;margin:18px 0 8px;color:var(--brand)}
.login p{color:var(--muted)}
.login small{display:block;margin-top:14px;color:var(--muted);overflow-wrap:anywhere}
.err{color:var(--bad);margin-top:12px}

.drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 32px -16px rgba(0,0,0,.35);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:20px}
.drawer .body{overflow:auto;padding:8px 18px 24px}
.drawer dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:0}
.drawer dt,.drawer dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
.drawer dt{color:var(--muted);font-size:13px}
.drawer dd{overflow-wrap:anywhere}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px}
  .brandbox{width:150px}.brandsub{display:none}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%}
  .nav a{white-space:nowrap}
  .side .who{margin:0 0 0 auto;padding:0;border:0}
}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const str = v => v == null ? '' : String(v).trim();
const num = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
};
const money = new Intl.NumberFormat(CONFIG.locale, { style: 'currency', currency: CONFIG.currency });
const moneyCompact = new Intl.NumberFormat(CONFIG.locale, { style: 'currency', currency: CONFIG.currency, notation: 'compact', maximumFractionDigits: 1 });
const fm = n => money.format(n || 0);

function toDate(v) {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') return v > 0 ? new Date(Math.round((v - 25569) * 864e5)) : null; // Excel serial -> UTC date
  const s = String(v).trim();
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const fmtDate = d => d ? d.toLocaleDateString(CONFIG.locale, { timeZone: 'UTC', day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const monthKey = d => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');

const groupBy = (rows, fn) => { const m = new Map(); for (const r of rows) { const k = fn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; };

/* ============================== COLUMN MAPPING ============================== */
// Headers are matched by name (not position), so reordering columns in Excel is safe.
const FIELDS = {
  calcCode:[/^calculation/], commStatus:[/^commission status/], payStatus:[/^payment status/], year:[/^year$/],
  locType:[/^location type/], parentAgent:[/^parent agent/], subAgent:[/^sub ?agent/], branch:[/^branch/],
  college:[/^college/], campus:[/^campus/], dob:[/^dob$/, /^date of birth/], studentId:[/^student id/], student:[/^student name/],
  course:[/^course name/], start:[/^start date/], end:[/^end date/], coe:[/^coe/], courseFee:[/^course fee/],
  tuition:[/^tuition/], rate:[/^comm(ission)? rate/],
  commission:[/^commission$/, /^commission (amount|ex)/, /^comm(ission)?( amount)?$/],
  gst:[/^gst$/], gstAmt:[/^gst amount/], total:[/^comm(ission)? with gst/],
  invNo:[/^invoice n/], invDate:[/^invoice date/], installment:[/^installment/], future:[/^future comm/],
  note:[/^account note/], remarks:[/^remark/], received:[/^received date/],
};
const DATE_KEYS = ['dob','start','end','coe','invDate','received'];
const MONEY_KEYS = ['courseFee','tuition','commission','gstAmt','total'];
const normHeader = h => String(h).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function resolveCols(headers) {
  const norm = headers.map(normHeader), used = new Set(), map = {};
  for (const [key, patterns] of Object.entries(FIELDS)) {
    for (const re of patterns) {
      const i = norm.findIndex((h, idx) => !used.has(idx) && re.test(h));
      if (i >= 0) { map[key] = i; used.add(i); break; }
    }
  }
  return map;
}

const redirectUri = (() => { const p = location.pathname.replace(/index\.html$/, ''); return location.origin + (p === '/' ? '' : p); })();
const msalApp = CONFIG.authRequired ? new msal.PublicClientApplication({
  auth: { clientId: CONFIG.clientId, authority: 'https://login.microsoftonline.com/' + CONFIG.tenantId, redirectUri },
  cache: { cacheLocation: 'localStorage' },
}) : null;

async function getToken(scopes = CONFIG.scopes) {
  try {
    return (await msalApp.acquireTokenSilent({ scopes, account: S.account })).accessToken;
  } catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError) {
      await msalApp.acquireTokenRedirect({ scopes, account: S.account });
      return new Promise(() => {}); // page is navigating away
    }
    throw e;
  }
}

async function graph(path, { retry = 2, scopes } = {}) {
  const t = await getToken(scopes);
  const res = await fetch(path.startsWith('http') ? path : GRAPH + path, { headers: { Authorization: 'Bearer ' + t } });
  if ((res.status === 429 || res.status === 503) && retry > 0) {
    await sleep((+res.headers.get('Retry-After') || 2) * 1000);
    return graph(path, { retry: retry - 1, scopes });
  }
  if (!res.ok) {
    let body = null; try { body = await res.json(); } catch {}
    const err = new Error(body?.error?.message || res.statusText || 'Request failed');
    err.status = res.status; err.code = body?.error?.code;
    throw err;
  }
  return res.json();
}

/* ============================== FILE + DATA ============================== */
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
let fileRef = null, fileRefUrl = '';

async function resolveFile(url) {
  if (fileRef && fileRefUrl === url) return fileRef;
  const candidates = [url];
  const base = url.split('&')[0];
  if (base !== url) candidates.push(base, base + '&action=default');
  let firstErr;
  for (const c of candidates) {
    try {
      const it = await graph(`/shares/u!${b64u(c)}/driveItem?$select=id,name,parentReference`);
      fileRefUrl = url;
      return (fileRef = { driveId: it.parentReference.driveId, itemId: it.id, name: it.name });
    } catch (e) { firstErr = firstErr || e; }
  }
  // Fallback: find the file in the SharePoint site by the id embedded in the link.
  const guid = /sourcedoc=(?:%7B|\{)([0-9a-f-]{36})/i.exec(url)?.[1]?.toLowerCase();
  if (guid && !sessionStorage.getItem('fld.sitesTried')) {
    sessionStorage.setItem('fld.sitesTried', '1');
    try {
      const u = new URL(url);
      const sitePath = /^\/(sites|teams)\/[^/]+/.exec(u.pathname)?.[0];
      const sc = ['Sites.Read.All'];
      const site = await graph(`/sites/${u.hostname}:${sitePath}?$select=id`, { scopes: sc });
      const drives = (await graph(`/sites/${site.id}/drives?$select=id`, { scopes: sc })).value;
      for (const d of drives) {
        const hits = (await graph(`/drives/${d.id}/root/search(q='.xlsx')?$select=id,name,eTag,parentReference`, { scopes: sc })).value;
        const hit = hits.find(h => String(h.eTag || '').toLowerCase().includes(guid));
        if (hit) { fileRefUrl = url; return (fileRef = { driveId: hit.parentReference.driveId, itemId: hit.id, name: hit.name }); }
      }
    } catch {}
  }
  throw firstErr || new Error('File not found');
}

async function fetchValues(ref, preferredTable) {
  const base = `/drives/${ref.driveId}/items/${ref.itemId}/workbook`;
  const tabs = (await graph(`${base}/tables?$select=id,name`)).value || [];
  S.tables = tabs.map(t => t.name);
  if (tabs.length) {
    const t = tabs.find(t => t.name === preferredTable) || tabs[0];
    S.tableName = t.name;
    const r = await graph(`${base}/tables/${encodeURIComponent(t.id)}/range?$select=values`);
    return r.values;
  }
  const ws = (await graph(`${base}/worksheets?$select=name`)).value;
  if (!ws.length) throw Object.assign(new Error('The workbook has no worksheets.'), { code: 'NO_DATA' });
  S.tableName = ws[0].name + ' (sheet)';
  const r = await graph(`${base}/worksheets/${encodeURIComponent(ws[0].name)}/usedRange(valuesOnly=true)?$select=values`);
  return r.values;
}

function processValues(values) {
  if (!values || values.length < 1) throw Object.assign(new Error('The table is empty.'), { code: 'NO_DATA' });
  const headers = values[0].map(h => str(h));
  const colMap = resolveCols(headers);
  const dateIdx = new Set(DATE_KEYS.map(k => colMap[k]).filter(i => i != null));
  const moneyIdx = new Set(MONEY_KEYS.map(k => colMap[k]).filter(i => i != null));
  const rows = values.slice(1).filter(r => r.some(v => v !== '' && v != null)).map((r, id) => {
    const g = k => colMap[k] != null ? r[colMap[k]] : '';
    const rec = {
      id,
      commStatus: str(g('commStatus')), payStatus: str(g('payStatus')), year: str(g('year')),
      parentAgent: str(g('parentAgent')), subAgent: str(g('subAgent')), college: str(g('college')),
      student: str(g('student')), studentId: str(g('studentId')), course: str(g('course')),
      invNo: str(g('invNo')), installment: str(g('installment')), future: str(g('future')),
      commission: num(g('commission')), gstAmt: num(g('gstAmt')), total: num(g('total')),
      tuition: num(g('tuition')), courseFee: num(g('courseFee')),
      invDate: toDate(g('invDate')), received: toDate(g('received')),
    };
    rec.studentKey = (rec.studentId || rec.student).toLowerCase();
    rec.cells = headers.map((h, ci) => dateIdx.has(ci) ? fmtDate(toDate(r[ci])) : moneyIdx.has(ci) && r[ci] !== '' ? fm(num(r[ci])) : r[ci] ?? '');
    rec.search = rec.cells.join(' ').toLowerCase();
    return rec;
  });
  return { headers, colMap, rows };
}

async function refresh() {
  if (S.loading) return;
  S.loading = true; setStatus();
  try {
    let values;
    if (CONFIG.authRequired) {
      const cfg = settings();
      const ref = await resolveFile(cfg.fileUrl);
      values = await fetchValues(ref, cfg.table);
      S.sourceName = ref.name;
      sessionStorage.removeItem('fld.sitesTried');
    } else {
      values = await loadLocalValues();
      if (!values) { S.needFile = true; if (!S.loaded) renderView(); return; }
    }
    S.needFile = false;
    const sig = JSON.stringify(values);
    if (sig !== S.rawSig || !S.loaded) {
      const p = processValues(values);
      Object.assign(S, p);
      S.rawSig = sig;
      S.loaded = true;
      S.error = null;
      S.updated = new Date();
      renderView(true);
    } else {
      S.updated = new Date(); S.error = null;
    }
  } catch (e) {
    S.error = e;
    if (!S.loaded) renderView();
  } finally {
    S.loading = false; setStatus();
  }
}

function setupTimer() {

/* ---- generic sortable table ---- */
function dataTable(id, cols, rows, o = {}) {
  const st = S.sort[id] || o.defaultSort;
  let data = rows.slice();
  if (st) {
    const c = cols.find(c => c.key === st.key);
    if (c) { const dir = st.dir === 'asc' ? 1 : -1;
      const cmp = c.cmp || ((a, b) => { const x = c.val(a) ?? '', y = c.val(b) ?? ''; return x > y ? 1 : x < y ? -1 : 0; });
      data.sort((a, b) => cmp(a, b) * dir); }
  }
  const total = data.length;
  if (o.page) data = data.slice(S.pageNo * CONFIG.pageSize, (S.pageNo + 1) * CONFIG.pageSize);
  const head = cols.map(c => `<th class="${c.num ? 'num' : ''}" data-sort="${esc(c.key)}" data-table="${id}">${esc(c.label)}${st?.key === c.key ? `<span class="arr">${st.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`).join('');
  const body = data.map(r => `<tr${o.rowAttr ? o.rowAttr(r) : o.rowClick ? ` data-row="${r.id ?? ''}"` : ''}>${cols.map(c => {
    const inner = c.html ? c.html(r) : esc(c.fmt ? c.fmt(c.val(r)) : c.val(r));
    return `<td class="${c.num ? 'num' : ''}${c.trunc ? ' trunc' : ''}">${inner}</td>`; }).join('')}</tr>`).join('');
  const foot = o.foot ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.num ? 'num' : ''}">${o.foot[c.key] ?? (i === 0 ? 'Total' : '')}</td>`).join('')}</tr></tfoot>` : '';
  return { html: `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`, total };
}

function groupedTable(id, rows, keyFn, cols, sortKey, extraFn) {
  const groups = [...groupBy(rows, keyFn)].map(([k, v]) => {
    const g = {
      key: k, lines: v.length, students: new Set(v.map(r => r.studentKey).filter(Boolean)).size,
      tuition: sum(v, 'tuition'), commission: sum(v, 'commission'), gstAmt: sum(v, 'gstAmt'), total: sum(v, 'total'), rows: v,
    };
    return extraFn ? extraFn(g, v) : g;
  });
  const max = Math.max(...groups.map(g => g.total), 1);
  groups.forEach(g => g.share = g.total / max);
  return dataTable(id, cols, groups, { defaultSort: { key: sortKey, dir: 'desc' } });
}

/* ============================== FILE MODE (no sign-in) ============================== */
function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  let best = null;
  for (const name of wb.SheetNames) {
    const values = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    if (!values.length) continue;
    const m = resolveCols(values[0].map(str));
    if (m.invNo != null && m.commission != null) return { values, sheet: name };
    if (!best) best = { values, sheet: name };
  }
  if (!best) throw Object.assign(new Error('No data found in this workbook.'), { code: 'NO_DATA' });
  return best;
}

async function loadLocalValues() {
  if (S.picked) return S.picked.values;
  try {
    const res = await fetch('data.xlsx', { cache: 'no-store' });
    if (!res.ok) return null;
    const p = parseWorkbook(await res.arrayBuffer());
    S.sourceName = 'data.xlsx'; S.tableName = p.sheet;
    return p.values;
  } catch (e) { if (e.code === 'NO_DATA') throw e; return null; }
}

async function pickFile(file) {
  if (!file) return;
  try {
    let values;
    if (/\.csv$/i.test(file.name)) {
      const wb = XLSX.read(await file.text(), { type: 'string', raw: true });
      values = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
      S.tableName = 'CSV';
    } else {
      const p = parseWorkbook(await file.arrayBuffer());
      values = p.values; S.tableName = p.sheet;
    }
    S.picked = { values }; S.sourceName = file.name;
    S.loaded = false; S.rawSig = ''; S.error = null; S.needFile = false;
  } catch (e) { S.error = e; S.loaded = false; renderView(); setStatus(); return; }
  refresh();
}

function syncInvSort() {
  const s = S.sort.invoices, sel = $('#invsort'), b = $('#invdir');
  if (sel) sel.value = ['dt', 'no', 'rc'].includes(s.key) ? s.key : sel.value;
  if (b) b.textContent = s.dir === 'asc' ? 'Ascending ▲' : 'Descending ▼';
}

function invLines() {
  const f = S.inv, q = f.invNo.trim().toLowerCase(), cash = f.basis === 'cash';
  return invBase().filter(r => {
    const d = basisDate(r);
    if (cash && !d) return false;                       // cash basis: only money actually received
    if (f.year || f.month) {
      if (!d) return false;
      if (f.year && String(d.getUTCFullYear()) !== f.year) return false;
      if (f.month && String(d.getUTCMonth() + 1) !== f.month) return false;
    }
    if (q && !r.invNo.toLowerCase().includes(q)) return false;
    if (f.college && r.college !== f.college) return false;
    if (f.commStatus && r.commStatus !== f.commStatus) return false;
    if (f.payStatus && r.payStatus !== f.payStatus) return false;
    return true;
  });
}

  const cols = [

    { key: 'com', label: 'Commission', num: true, val: g => g.commission, fmt: fm },
    { key: 'gst', label: 'GST', num: true, val: g => g.gstAmt, fmt: fm },
    { key: 'tot', label: 'Total', num: true, val: g => g.total, fmt: fm },
  ];
  const t = dataTable('invoices', cols, groups, { rowAttr: g => ` data-invrow="${encodeURIComponent(g.key)}"`,
    foot: { no: 'Total', ln: lines.length, com: fm(C), gst: fm(G), tot: fm(T) } });
  el.innerHTML = `
    <div class="ledger">
      <div class="big"><div class="lbl">Total incl. GST</div><div class="val">${fm(T)}</div><div class="sub">${groups.length} invoices, ${lines.length} lines</div></div>
      <div><div class="lbl">Commission</div><div class="val">${fm(C)}</div></div>

/* ============================== EVENTS ============================== */
let qTimer;
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id !== 'q' && id !== 'invq') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    if (id === 'q') S.filters.q = e.target.value; else S.inv.invNo = e.target.value;
    S.pageNo = 0; updateResults();
  }, 150);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'filePick') { pickFile(t.files[0]); t.value = ''; return; }
  if (t.dataset.inv) { S.inv[t.dataset.inv] = t.value; updateResults(); return; }
  if (t.id === 'invsort') { S.sort.invoices = { key: t.value, dir: S.sort.invoices.dir }; updateResults(); return; }
  if (t.dataset.filter) { S.filters[t.dataset.filter] = t.value; S.pageNo = 0; updateResults(); }
  else if (t.dataset.act === 'allcols') { S.allCols = t.checked; S.pageNo = 0; updateResults(); }
});
document.addEventListener('click', e => {
  const bs = e.target.closest('[data-basis]');
  if (bs) { S.inv.basis = bs.dataset.basis; renderView(); return; }
  const ir = e.target.closest('[data-invrow]');
  if (ir) return openInvoice(decodeURIComponent(ir.dataset.invrow));
  const th = e.target.closest('[data-sort]');
  if (th) {
    const id = th.dataset.table, key = th.dataset.sort, cur = S.sort[id];
    S.sort[id] = { key, dir: cur && cur.key === key && cur.dir === 'desc' ? 'asc' : cur && cur.key === key ? 'desc' : (th.classList.contains('num') ? 'desc' : 'asc') };
    updateResults(); syncInvSort(); return;
  }
  const pg = e.target.closest('[data-pg]');
  if (pg) { S.pageNo = Math.max(0, S.pageNo + +pg.dataset.pg); updateResults(); return; }
  const row = e.target.closest('[data-row]');
  if (row) return openDrawer(+row.dataset.row);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'invdir') { const s = S.sort.invoices; s.dir = s.dir === 'asc' ? 'desc' : 'asc'; syncInvSort(); updateResults(); }
  else if (act === 'invclear') { S.inv = { basis: S.inv.basis, year: '', month: '', invNo: '', college: '', commStatus: '', payStatus: '' }; renderView(); }
  else if (act === 'pick') { const fp = $('#filePick'); if (fp) fp.click(); }
  else if (act === 'clear') { S.filters = { year: '', commStatus: '', payStatus: '', college: '', q: '' }; S.pageNo = 0; renderView(); }
  else if (act === 'csv') downloadCsv();
  else if (act === 'close') closeDrawer();
  else if (act === 'retry') { S.error = null; refresh(); }
  else if (act === 'save') {
    store.set({ fileUrl: $('#setUrl').value.trim() || CONFIG.defaultFileUrl, table: $('#setTable').value, refreshSeconds: +$('#setRefresh').value });
    fileRef = null; S.loaded = false; S.rawSig = ''; S.error = null; sessionStorage.removeItem('fld.sitesTried');
    setupTimer(); location.hash = '#/invoices'; refresh();
  }
  else if (!e.target.closest('#drawer')) closeDrawer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.updated && Date.now() - S.updated > 30000 && S.account) refresh();
});
window.addEventListener('hashchange', () => { if (S.account) route(); });

/* ============================== BOOT ============================== */
(async function boot() {
  if (!CONFIG.authRequired) {
    S.account = { name: 'Guest view', username: '' };
    renderShell(); route(); setupTimer(); refresh();
    return;
  }
  try {
    await msalApp.initialize();
    const res = await msalApp.handleRedirectPromise();
    S.account = res?.account || msalApp.getActiveAccount() || msalApp.getAllAccounts()[0] || null;
  } catch (e) {
    return showLogin(e.errorMessage || e.message);
  }
  if (!S.account) return showLogin();
  msalApp.setActiveAccount(S.account);
  renderShell();
  route();
  setupTimer();
  refresh();
})();
})();
</script>
</body>
</html>
